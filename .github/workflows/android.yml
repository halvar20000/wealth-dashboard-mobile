name: Build the app

# Every push builds a debug APK and hangs it off the run, so a change
# can be installed on a phone without a laptop in the loop. A tag also
# builds a release APK, signed if the repository holds a keystore.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'LICENSE', '.gitignore']
  pull_request:
  workflow_dispatch:

# The release step writes a release; nothing else needs more than a read.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper jar in the repository: a binary nobody can read is a
      # binary nobody can check. Gradle comes from the action instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The keystore, if this repository has one. Gradle signs with it —
      # both the APK people sideload and the bundle Play wants — so the
      # two can never be signed by different things.
      - name: Unpack the keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No KEYSTORE_BASE64 secret: the release will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Assemble the release APK and the Play bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
