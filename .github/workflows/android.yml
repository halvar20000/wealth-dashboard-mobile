name: Build the app

# Every push builds a debug APK and hangs it off the run, so a change
# can be installed on a phone without a laptop in the loop. A tag also
# builds a release APK, signed if the repository holds a keystore.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'LICENSE', '.gitignore']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper jar in the repository: a binary nobody can read is a
      # binary nobody can check. Gradle comes from the action instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign it, if this repository has a keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > /tmp/keystore.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks /tmp/keystore.jks \
            --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/wealth-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/keystore.jks

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
