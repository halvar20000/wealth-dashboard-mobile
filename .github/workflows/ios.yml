name: Build the iOS app

# A change under ios/ is built and tested on a simulator; a tag also
# archives the app, signs it and uploads it to TestFlight, if the
# repository holds an App Store Connect API key.
#
# This repository is public, so Actions minutes are free — macOS ones
# too, which bill at 10× the Linux rate everywhere else. The filter
# below stays anyway: a build that nobody needs is still four minutes
# of waiting for the one that follows it, and a green tick that means
# "iOS unchanged" is easier to read than one that means "built again
# for nothing".
#
# A macOS runner starts only when:
#   • a tag is pushed (a release must always build), or
#   • the push or pull request actually touched ios/, or
#   • somebody asks for it by hand, or
#   • this workflow itself changed.
#
# The filter lives in a job rather than in `on: paths:` on purpose:
# GitHub applies path filters to tag pushes as well, and a tag sitting
# on an Android-only commit would then silently skip the iOS release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fifteen seconds on Linux to spare ten minutes of quota on macOS.
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -e
          if ! compgen -G "ios/*.xcodeproj" >/dev/null && ! compgen -G "ios/*.xcworkspace" >/dev/null; then
            echo "No Xcode project under ios/ yet — nothing to build."
            echo "build=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "A tag or a manual run: always build."
            echo "build=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base to compare against — build to be safe."
            echo "build=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" \
             | grep -qE '^(ios/|\.github/workflows/ios\.yml)'; then
            echo "ios/ changed."
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under ios/ changed — no macOS runner needed."
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: decide
    if: needs.decide.outputs.build == 'yes'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Half of a cold iOS build is resolving and compiling packages.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ios-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/project.pbxproj') }}
          restore-keys: ios-${{ runner.os }}-

      # The newest released Xcode on the image: App Store Connect only
      # takes builds made with a recent SDK.
      - name: Pick Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Whichever iPhone simulator the image has, newest runtime first —
      # a hard-coded name breaks the day the image changes.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS")[-1])]
          phones = [(version(rt), d["udid"]) for rt, ds in devices.items() if "iOS" in rt
                    for d in ds if d["name"].startswith("iPhone")]
          print(max(phones)[1])')
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project Wealth.xcodeproj -scheme Wealth \
            -destination "id=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # No key, no upload — and no red tag either: the Android release
      # on the same tag must not look broken because iOS is not set up.
      - name: Is there a key?
        id: key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::No App Store Connect key in the secrets: nothing goes to TestFlight."
            echo "found=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "found=yes" >> "$GITHUB_OUTPUT"

      - name: Pick Xcode
        if: steps.key.outputs.found == 'yes'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The tag is the version, as on Android: v1.2.3 is marketing
      # version 1.2.3 and build 10203.
      - name: Version from the tag
        if: steps.key.outputs.found == 'yes'
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::A tag reads v1.2.3; $GITHUB_REF_NAME does not."
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"

      # Signing is Xcode's own, done in the cloud with the API key: no
      # certificate or profile lives in this repository or its secrets.
      # When a target's profile is made during the archive itself (a new
      # extension, a renewed profile), xcodebuild can look for the file
      # before it is on disk. The second try finds it, so there is one.
      # On a fresh runner the archive has to fetch a profile for every
      # target at once, and v1.2.2 showed it can plan with the share
      # extension's profile and never write the file (twice, each time a
      # new one). Building each extension alone first fetches its profile
      # by itself; the archive then finds them all on disk.
      - name: Fetch the signing profiles
        if: steps.key.outputs.found == 'yes'
        working-directory: ios
        run: |
          for target in WealthShare WealthWidget; do
            xcodebuild build \
              -project Wealth.xcodeproj -target "$target" -configuration Release \
              -sdk iphoneos \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              SYMROOT="$RUNNER_TEMP/prep" OBJROOT="$RUNNER_TEMP/prep" \
              -quiet \
              || echo "::warning::Building $target alone failed; the archive will say why."
          done
          ls -l "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" || true

      - name: Archive
        if: steps.key.outputs.found == 'yes'
        working-directory: ios
        run: |
          archive() {
            rm -rf "$RUNNER_TEMP/Wealth.xcarchive"
            xcodebuild archive \
              -project Wealth.xcodeproj -scheme Wealth -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Wealth.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD"
          }
          archive || { echo "::warning::Archive failed once; trying again with the profiles now in place."; archive; }

      - name: Upload to TestFlight
        if: steps.key.outputs.found == 'yes'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyLists-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wealth.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
