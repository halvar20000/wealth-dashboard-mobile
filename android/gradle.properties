org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Play requires new releases to target API 36, and this Android Gradle
# plugin was tested up to 35 — it builds against 36 and says so once
# rather than on every task. The app asks nothing of API 36 beyond
# being allowed into the store.
android.suppressUnsupportedCompileSdk=36
